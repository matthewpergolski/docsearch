# Lint and unit tests on Linux, CPU only (the runner has no GPU, so the device is cpu).
# The tests use fakes: no model downloads, no LLM, no API key.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"        # a test that tries to download a model fails instead
      TRANSFORMERS_OFFLINE: "1"
      DOCSEARCH_PLAIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install from the lockfile (CPU-only torch, the search page API)
        run: uv sync --frozen --extra cpu --extra ui
      # Quality: ruff + unit tests via the single local/CI entrypoint.
      - name: Check
        run: ./scripts/check
