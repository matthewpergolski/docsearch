# Lint and unit tests on Linux, CPU only (the runner has no GPU, so the device is cpu).
# The tests use fakes: no model downloads, no LLM, no API key.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"        # a test that tries to download a model fails instead
      TRANSFORMERS_OFFLINE: "1"
      DOCSEARCH_PLAIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install from the lockfile (CPU-only torch, the search page API)
        run: uv sync --frozen --extra cpu --extra ui
      # --no-sync: keep the extras that the install step put in .venv
      - name: Ruff check
        run: uv run --no-sync ruff check src tests scripts
      - name: Ruff format
        run: uv run --no-sync ruff format --check src tests scripts
      - name: Unit tests
        run: uv run --no-sync python -m unittest discover -s tests
